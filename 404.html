<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oldal átirányítás</title>
  <meta http-equiv="refresh" content="0; url=/index.html">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06111b;color:#e8eef7;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}
    .card{max-width:560px;background:#0e1b28;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    a{color:#4dd0ff}
  </style>
  <script>
    (function(){
      try {
        var path = window.location.pathname || '/';
        if (path === '/' || path === '/index' || path === '/index/') {
          window.location.replace('/index.html');
          return;
        }
        if (path === '/admin' || path === '/admin/') {
          window.location.replace('/admin.html');
          return;
        }
        if (path === '/products' || path === '/products/') {
          window.location.replace('/products.html');
          return;
        }
        if (path === '/checkout' || path === '/checkout/') {
          window.location.replace('/checkout.html');
          return;
        }
        window.location.replace('/index.html');
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Átirányítás…</h1>
    <p>Ha nem ugrik tovább automatikusan, nyisd meg a <a href="/index.html">kezdőlapot</a>.</p>
    <p><strong>Fontos:</strong> ha a Netlify továbbra is <em>Site not found</em> képernyőt mutat, akkor nem az oldal fájljával van gond, hanem a megnyitott Netlify URL nem létező site-ra mutat.</p>
  </div>
</body>
</html>
